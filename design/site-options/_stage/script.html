<script>
(function () {
  var doc = document.documentElement;
  var still = navigator.webdriver && !window.MOTION_CAPTURE && !/[?&]motion/.test(location.search);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!still && !reduce) doc.classList.add('x-js');

  /* Answers are assembled ONLY from lines of whatisgeo.app/guide.md (the home guide as Markdown, saved in assets/guide.md on 2026-11-10; parts synced to the live src/data/stage.ts). Sentences are the file's own words, trimmed, never added to.
     Each part = [text, line] (a footnote + thread to that line), or [text, -1] (a gap: the guide doesn't say). */
  var ANSWERS = {
    what: { q: "What is GEO?", parts: [
      ["Generative Engine Optimisation (GEO) is the practice of improving how visible and accurately represented your website or content is in answers generated by AI systems.", 10],
      [" GEO doesn’t replace SEO. It sits on top of it.", 18],
      [" If your site is already thin, unclear, or badly structured, no amount of GEO tinkering will save it.", 12] ] },
    seo: { q: "Is SEO dead now that AI answers exist?", parts: [
      ["No. Google’s own guidance confirms that a page must be indexed and eligible for a normal search snippet before it can feed AI Overviews or AI Mode.", 186],
      [" GEO is an additional lens on top, not a separate discipline built from scratch.", 182],
      [" Anyone telling you otherwise is selling something.", 186] ] },
    llms: { q: "Do I need an llms.txt file?", parts: [
      ["llms.txt is a proposed file offering a plain-text summary and navigation aid for AI systems. It’s optional.", 90],
      [" It’s not a proven ranking factor, it doesn’t grant crawl permission on its own, and it doesn’t replace robots.txt or your sitemap.", 202],
      [" Fine to add once your fundamentals are solid; not urgent.", 202] ] },
    crawl: { q: "What’s the difference between AI training and AI search?", parts: [
      ["Training is how a model learned language and facts from a large historical dataset, fixed at a point in time.", 210],
      [" Allowing OAI-SearchBot to surface your pages in search results does not mean you’ve agreed to GPTBot training on your content.", 82],
      [" PerplexityBot exists to surface and link sites within answers, not to train a foundation model.", 84] ] },
    promise: { q: "Can you guarantee we’ll be cited by ChatGPT or Google?", parts: [
      ["No, and be wary of anyone who says yes.", 206],
      [" Citation and mention outcomes vary by platform, query, and time.", 206],
      [" A single check is a sample, not a universal ranking.", 167] ] },
    tool: { q: "Which GEO tool should I buy?", parts: [
      ["A vendor’s visibility score describes its own sample of prompts and platforms. It isn’t a universal GEO rank.", 154],
      [" The guide doesn’t recommend one.", -1] ], note: ["A gap.", " An assistant can only quote what a page says. This guide names no tool to buy, so the answer stops there."] }
  };
  var SPLIT = 110; /* the last line number on the left wall (gen/wall.py prints it) */

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return [].slice.call((r || document).querySelectorAll(s)); }
  function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  var SVG = 'http://www.w3.org/2000/svg';

  document.addEventListener('DOMContentLoaded', function () {
    var animated = doc.classList.contains('x-js');

    /* ---- scroll reveals */
    var rev = $$('[data-reveal]');
    if (animated && 'IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.setAttribute('data-revealed', ''); io.unobserve(e.target); } });
      }, { rootMargin: '0px 0px -10% 0px' });
      rev.forEach(function (el) { io.observe(el); });
    } else rev.forEach(function (el) { el.setAttribute('data-revealed', ''); });

    /* ---- the stage */
    var stage = $('#stage'); if (!stage) return;
    var qEl = $('[data-x="q"]', stage), prose = $('[data-x="prose"]', stage), answer = $('[data-x="answer"]', stage);
    var note = $('[data-x="note"]', stage), without = $('[data-x="without"]', stage), srcs = $('[data-x="srcs"]', stage);
    var svg = $('[data-x="threads"]', stage), walls = { l: $('.x-wall[data-side="l"]', stage), r: $('.x-wall[data-side="r"]', stage) };
    var chips = $$('[data-q]', stage);
    chips.forEach(function (c, k) { c.style.setProperty('--k', k + 1); });
    var lbl = $('.x-pills .ds-suggestion-chips__label', stage); if (lbl) lbl.style.setProperty('--k', 0);
    var lineEl = {}; $$('.x-wall li[data-n]', stage).forEach(function (li) { lineEl[li.getAttribute('data-n')] = li; });
    var current = 'what', run = 0, timers = [], built = null;

    function later(fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
    function clearTimers() { timers.forEach(clearTimeout); timers = []; }
    function lineText(n) { var li = lineEl[n]; return li ? li.textContent.trim() : ''; }
    /* the callout opens the line AT the words the answer used (lines here are whole paragraphs) */
    function excerpt(n, said) {
      var t = lineText(n), w = said.replace(/[\u2018\u2019]/g, "'").trim().split(/\s+/), tt = t.replace(/[\u2018\u2019]/g, "'");
      for (var k = 0; k < Math.min(4, w.length - 3); k++) {
        var probe = w.slice(k, k + 4).join(' '), i = tt.indexOf(probe);
        if (i > -1) return i > 30 ? '\u2026' + t.slice(i) : t;
      }
      return t;
    }
    function sideOf(n) { return n <= SPLIT ? 'l' : 'r'; }

    /* build the answer DOM: sentences of hidden words, each followed by its footnote */
    function buildAnswer(a) {
      var html = '', used = [], said = {}, tone = a.warn || [];
      a.parts.forEach(function (p, i) {
        var words = p[0].split(/(\s+)/).map(function (w) { return w.trim() ? '<span class="x-w">' + esc(w) + '</span>' : w; }).join('');
        html += '<span class="x-sent" data-line="' + p[1] + '">' + words + '</span>';
        if (p[1] > 0) {
          var k = used.indexOf(p[1]); if (k < 0) { used.push(p[1]); said[p[1]] = p[0]; k = used.length - 1; }
          html += '<a class="ds-citation-sources-cite" href="#stage" data-line="' + p[1] + '" aria-label="Source ' + (k + 1) + ': guide.md line ' + p[1] + ', ' + esc(lineText(p[1])) + '"><span class="ds-citation-sources-cite__num">' + (k + 1) + '</span></a>';
        } else html += '<span class="x-gap-cite" data-line="gap">not in the guide</span>';
      });
      prose.innerHTML = '<p>' + html + '</p>';
      if (note) { note.hidden = true; note.innerHTML = a.note ? '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 5v3.5M8 11h.01"/></svg><span><b>' + a.note[0] + '</b>' + a.note[1] + '</span>' : ''; }
      /* callouts on the wall + the phone source list */
      $$('.x-callout', stage).forEach(function (c) { c.remove(); });
      $$('li[data-lit]', stage).forEach(function (li) { li.removeAttribute('data-lit'); });
      if (srcs) srcs.innerHTML = '';
      used.forEach(function (n, k) {
        var warn = tone.indexOf(n) > -1, t = esc(excerpt(n, said[n] || ''));
        var c = document.createElement('div');
        c.className = 'x-callout'; c.setAttribute('data-line', n); if (warn) c.setAttribute('data-tone', 'warn');
        c.innerHTML = '<span class="x-callout__n"><b>' + (k + 1) + '</b>line ' + n + (warn ? ' · out of date' : '') + '</span><span class="x-callout__t">' + t + '</span>';
        walls[sideOf(n)].appendChild(c);
        if (srcs) { var li = document.createElement('li'); li.setAttribute('data-line', n); if (warn) li.setAttribute('data-tone', 'warn'); li.innerHTML = '<b>' + (k + 1) + ' · L' + n + '</b><span>' + t + '</span>'; srcs.appendChild(li); }
      });
      return { used: used, tone: tone };
    }

    /* pin each callout where its line sits in the file, then de-overlap per wall (neighbouring lines, e.g. 10, 12
       and 18, would otherwise stack): push down in line order, then back up if the last one runs off the stage */
    function place() {
      ['l', 'r'].forEach(function (side) {
        var wall = walls[side]; if (!wall) return;
        var wr = wall.getBoundingClientRect(), gap = 6, items = [];
        $$('.x-callout', wall).forEach(function (c) {
          var li = lineEl[c.getAttribute('data-line')]; if (!li) return;
          var lr = li.getBoundingClientRect(), h = c.offsetHeight;
          items.push({ c: c, h: h, y: lr.top - wr.top + lr.height / 2 - h / 2 });
        });
        items.sort(function (a, b) { return a.y - b.y; });
        var floor = 8;
        items.forEach(function (it) { it.y = Math.max(floor, it.y); floor = it.y + it.h + gap; });
        var ceil = wr.height - 8;
        for (var i = items.length - 1; i >= 0; i--) { var it = items[i]; it.y = Math.min(it.y, ceil - it.h); ceil = it.y - gap; }
        items.forEach(function (it) { it.c.style.top = Math.max(8, it.y) + 'px'; });
      });
    }

    /* draw a thread from each footnote to its callout's inner edge */
    function threads() {
      if (!svg) return;
      svg.innerHTML = '';
      var sr = stage.getBoundingClientRect();
      if (getComputedStyle(svg).display === 'none') return;
      svg.setAttribute('viewBox', '0 0 ' + sr.width + ' ' + sr.height);
      var pr = prose.getBoundingClientRect();
      $$('.ds-citation-sources-cite[data-line]', prose).forEach(function (cite) {
        var n = cite.getAttribute('data-line'), c = $('.x-callout[data-line="' + n + '"]', stage); if (!c) return;
        var a = cite.getBoundingClientRect(), b = c.getBoundingClientRect(), left = sideOf(+n) === 'l';
        /* threads leave from the answer's margin at the footnote's height, so they never cross the text */
        var x1 = (left ? pr.left - 14 : pr.right + 14) - sr.left, y1 = a.top + a.height / 2 - sr.top;
        var x2 = (left ? b.right : b.left) - sr.left, y2 = b.top + b.height / 2 - sr.top;
        var dx = Math.max(40, Math.abs(x2 - x1) * .6) * (left ? -1 : 1);
        var p = document.createElementNS(SVG, 'path'); p.style.opacity = '0';
        p.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ' ' + (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2);
        p.setAttribute('data-line', n); if (c.hasAttribute('data-tone')) p.setAttribute('data-tone', 'warn');
        svg.appendChild(p);
        p.style.transition = 'none'; p.style.setProperty('--len', Math.ceil(p.getTotalLength() + 2)); p.getBoundingClientRect(); p.style.transition = ''; p.style.opacity = '';
        [[x1, y1], [x2, y2]].forEach(function (pt, i) {
          var dot = document.createElementNS(SVG, 'circle'); dot.setAttribute('cx', pt[0]); dot.setAttribute('cy', pt[1]); dot.setAttribute('r', i ? 3.5 : 2.5);
          dot.setAttribute('data-line', n); dot.setAttribute('data-end', i); if (c.hasAttribute('data-tone')) dot.setAttribute('data-tone', 'warn');
          svg.appendChild(dot);
        });
      });
    }

    /* light one source: footnote → thread → the wall line → its callout (and the phone list row) */
    function light(n, instant) {
      var cite = $('.ds-citation-sources-cite[data-line="' + n + '"]', prose);
      if (cite) cite.setAttribute('data-on', '');
      $$('[data-line="' + n + '"]', svg).forEach(function (el) { if (el.getAttribute('data-end') !== '1') el.setAttribute('data-on', ''); });
      function land() {
        if (lineEl[n]) lineEl[n].setAttribute('data-lit', '');
        $$('.x-callout[data-line="' + n + '"], .x-srcs li[data-line="' + n + '"], circle[data-end="1"][data-line="' + n + '"]', stage).forEach(function (el) { el.setAttribute('data-on', ''); });
      }
      if (instant) land(); else later(land, 520);
    }

    function finish(a) {
      answer.removeAttribute('data-streaming'); answer.removeAttribute('aria-busy');
      $$('.x-w, .x-gap-cite', prose).forEach(function (w) { w.setAttribute('data-on', ''); });
      if (note && a.note) note.hidden = false;
      stage.setAttribute('data-ready', ''); stage.removeAttribute('data-typing'); stage.setAttribute('data-idle', '');
    }

    function go(key, stream) {
      var a = ANSWERS[key]; if (!a) return;
      var me = ++run; clearTimers(); current = key; stage.setAttribute('data-live', '');
      chips.forEach(function (c) { c.setAttribute('aria-pressed', c.getAttribute('data-q') === key ? 'true' : 'false'); });
      built = buildAnswer(a);
      if (!stream) {
        qEl.textContent = a.q; place(); threads();
        built.used.forEach(function (n) { light(n, true); });
        finish(a); return;
      }
      answer.setAttribute('data-streaming', ''); answer.setAttribute('aria-busy', 'true');
      stage.removeAttribute('data-idle'); stage.setAttribute('data-typing', '');
      place(); threads();
      /* erase the old question, type the new one */
      var old = qEl.textContent, i = old.length;
      (function erase() {
        if (me !== run) return;
        if (i > 0 && old !== a.q) { qEl.textContent = old.slice(0, --i); later(erase, 14); return; }
        if (old === a.q) { later(stream1, 250); return; }
        var j = 0;
        (function type() {
          if (me !== run) return;
          qEl.textContent = a.q.slice(0, ++j);
          if (j < a.q.length) later(type, 28 + Math.random() * 26); else later(stream1, 220);
        })();
      })();
      /* stream the answer word by word; each sentence end throws its thread */
      function stream1() {
        if (me !== run) return;
        stage.removeAttribute('data-typing');
        var seq = $$('.x-w, .ds-citation-sources-cite, .x-gap-cite', prose), k = 0;
        (function step() {
          if (me !== run) return;
          var el = seq[k++]; if (!el) { later(function () { if (me === run) finish(a); }, 350); return; }
          if (el.classList.contains('x-w')) { el.setAttribute('data-on', ''); later(step, 20 + Math.random() * 18); }
          else if (el.classList.contains('x-gap-cite')) { el.setAttribute('data-on', ''); later(step, 380); }
          else { light(el.getAttribute('data-line')); later(step, 200); }
        })();
      }
    }

    /* hover / focus a sentence or a footnote: its thread and line stay bright, the rest dim */
    function focusLine(n) {
      $$('.x-sent, .x-callout, .x-threads path, .x-threads circle', stage).forEach(function (el) {
        if (n && el.getAttribute('data-line') !== n) el.setAttribute('data-dim', ''); else el.removeAttribute('data-dim');
      });
      $$('.ds-citation-sources-cite', prose).forEach(function (c) { if (n && c.getAttribute('data-line') === n) c.setAttribute('data-hot', ''); else c.removeAttribute('data-hot'); });
    }
    prose.addEventListener('mouseover', function (e) { var t = e.target.closest('[data-line]'); if (t && !answer.hasAttribute('data-streaming')) focusLine(t.getAttribute('data-line') === 'gap' ? '-1' : t.getAttribute('data-line')); });
    prose.addEventListener('mouseleave', function () { focusLine(null); });
    prose.addEventListener('focusin', function (e) { var t = e.target.closest('[data-line]'); if (t) focusLine(t.getAttribute('data-line')); });
    prose.addEventListener('focusout', function () { focusLine(null); });
    prose.addEventListener('click', function (e) { if (e.target.closest('.ds-citation-sources-cite')) e.preventDefault(); });

    chips.forEach(function (c) { c.addEventListener('click', function () { setSource('with', true); go(c.getAttribute('data-q'), animated); }); });

    function setSource(v, quiet) {
      var r = $('input[name="x-src"][value="' + v + '"]', stage); if (r) r.checked = true;
      var off = v === 'without';
      stage.setAttribute('data-src', v);
      answer.hidden = off; without.hidden = !off;
      if (off) { run++; clearTimers(); stage.setAttribute('data-ready', ''); stage.setAttribute('data-idle', ''); stage.removeAttribute('data-typing'); }
    }
    $$('input[name="x-src"]', stage).forEach(function (r) { r.addEventListener('change', function () { setSource(r.value); if (r.value === 'with') go(current, animated); }); });

    var rz = null;
    window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (stage.getAttribute('data-src') !== 'with') return; place(); threads(); if (!answer.hasAttribute('data-streaming')) built.used.forEach(function (n) { light(n, true); }); }, 120); });

    /* pause the caret blink while the stage is off-screen */
    if ('IntersectionObserver' in window) new IntersectionObserver(function (es) { if (es[0].isIntersecting) stage.removeAttribute('data-off'); else stage.setAttribute('data-off', ''); }).observe(stage);

    /* first paint: the finished answer is in the HTML; animated pages run the opening once fonts are in */
    var ready = (document.fonts && document.fonts.ready) || Promise.resolve();
    if (!animated) { ready.then(function () { go(current, false); }); return; }
    qEl.textContent = '';
    stage.setAttribute('data-intro', '');
    buildAnswer(ANSWERS[current]); answer.setAttribute('data-streaming', '');
    ready.then(function () { setTimeout(function () { go(current, true); }, 400); setTimeout(function () { stage.removeAttribute('data-intro'); }, 2400); });
  });
})();
</script>
