<style>
/* ============================================================================
   Option C · questions — layout glue only (tokens only, classes .c-*).
   Every page is a run of question/answer rows: the question left (5/12, Manrope), the answer right (7/12, Inter,
   one body size), hairline rows between them, and the hero's blue footnotes under each answer pointing at the real
   guide.md line, shown in the hero's own mono line label (.x-ln, from ../_stage/style.html, reused not restyled).
   Uses the stage's page frame knobs (--x-pad, --x-max) so every page lines up with the hero.
   ========================================================================== */
:root { --c-gap: clamp(var(--ds-space-6), 4vw, var(--ds-space-16)); --c-top: calc(var(--ds-space-16) + var(--ds-space-4)); }
.c-wrap { inline-size: 100%; max-inline-size: calc(var(--x-max) + 2 * var(--x-pad)); margin-inline: auto; padding-inline: var(--x-pad); }

/* --- the ask row: the hero's six questions as the secondary nav */
.c-ask { border-block-end: 1px solid var(--ds-rule); background-color: var(--ds-ground); }
.c-ask__track { padding-block: var(--ds-space-2); }
.c-ask a.ds-suggestion-chips__chip { text-decoration: none; } /* gap: the chip is documented as a <button>; here it is a link */

/* --- type */
.c-h1 { margin: 0; font-family: var(--ds-font-display); font-weight: var(--ds-display-weight); letter-spacing: var(--ds-display-tracking); line-height: 1.08; font-size: clamp(var(--ds-text-2xl), calc(1rem + 2vw), var(--ds-text-3xl)); text-wrap: balance; }
.c-h1[data-size="article"] { max-inline-size: 38ch; margin-block: var(--ds-space-3) 0; }
.c-h2 { margin: 0; font-family: var(--ds-font-display); font-weight: var(--ds-heading-weight); letter-spacing: var(--ds-heading-tracking); line-height: var(--ds-lh-heading); font-size: clamp(var(--ds-text-xl), calc(.9rem + .8vw), var(--ds-text-2xl)); }
.c-q { margin: 0; font-family: var(--ds-font-display); font-weight: var(--ds-heading-weight); letter-spacing: var(--ds-heading-tracking); line-height: 1.25; font-size: clamp(var(--ds-text-lg), calc(.8rem + .7vw), var(--ds-text-xl)); text-wrap: balance; max-inline-size: 26ch; }
.c-q[data-size="lg"] { font-size: clamp(var(--ds-text-xl), calc(.9rem + 1vw), var(--ds-text-2xl)); }
.c-q[data-size="sm"] { font-size: var(--ds-text-lg); max-inline-size: none; }
.c-q__a { color: inherit; text-decoration: none; }
.c-q__a:hover { color: var(--ds-accent-ink); }
.c-h4 { margin: 0; display: flex; gap: var(--ds-space-3); align-items: baseline; font-family: var(--ds-font-display); font-weight: var(--ds-heading-weight); letter-spacing: var(--ds-heading-tracking); line-height: var(--ds-lh-heading); font-size: var(--ds-text-lg); color: var(--ds-ink); }
.c-h4__n { flex: none; font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); font-weight: var(--ds-weight-regular); letter-spacing: 0; color: var(--ds-ink-muted); }
.c-meta { margin: 0; font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); line-height: var(--ds-lh-body); color: var(--ds-ink-muted); }
.c-meta a { color: inherit; }
.c-label { margin: 0; font-size: var(--ds-text-sm); font-weight: var(--ds-weight-semibold); color: var(--ds-ink); }
.c-fine { margin: 0; font-size: var(--ds-text-sm); line-height: var(--ds-lh-body); color: var(--ds-ink-muted); }
.c-fine a { color: inherit; }
.c-ext { margin-inline-start: .2em; font-size: .85em; }
.c-code { font-family: var(--ds-font-mono); font-size: .9em; padding-inline: .3em; border-radius: var(--ds-radius-xs); background: var(--ds-surface-2); }

/* --- sections + the row grid */
.c-sec { padding-block-start: clamp(var(--ds-space-12), 6vw, var(--ds-space-20)); }
.c-sec[data-last] { padding-block-end: clamp(var(--ds-space-12), 6vw, var(--ds-space-20)); }
.c-head { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); column-gap: var(--c-gap); row-gap: var(--ds-space-2); align-items: baseline; padding-block-end: var(--ds-space-5); }
.c-head__note { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--ds-space-2) var(--ds-space-5); font-size: var(--ds-text-md); line-height: var(--ds-lh-body); color: var(--ds-ink-muted); max-inline-size: 40rem; }
.c-rows { margin: 0; padding: 0; list-style: none; border-block-end: 1px solid var(--ds-rule); }
.c-row { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); column-gap: var(--c-gap); row-gap: var(--ds-space-3); padding-block: var(--ds-space-8); border-block-start: 1px solid var(--ds-rule); }
.c-row[data-kind="lead"], .c-row[data-kind="title"], .c-row[data-kind="signup"], .c-row[data-kind="sources"] { border-block-start: 0; padding-block-start: 0; }
.c-row[data-kind="short"] { margin-block-start: var(--ds-space-8); }
.c-rows[data-kind="chapters"] > .c-row { padding-block: var(--ds-space-10) var(--ds-space-12); }
.c-side { display: flex; flex-direction: column; align-items: flex-start; gap: var(--ds-space-2); min-width: 0; }
.c-side__p { margin: 0; font-size: var(--ds-text-md); line-height: var(--ds-lh-body); color: var(--ds-ink-muted); max-inline-size: 30rem; }
@media (min-width: 900px) {
  .c-side[data-sticky] { position: sticky; inset-block-start: var(--c-top); align-self: start; }
}

/* the answer: one body size, a reading measure */
.c-a { display: flex; flex-direction: column; gap: var(--ds-space-4); min-width: 0; max-inline-size: 42rem; }
.c-a > p, .c-sub > p, .c-a li { margin: 0; font-size: var(--ds-text-lg); line-height: var(--ds-lh-prose); color: var(--ds-ink-2); text-wrap: pretty; }
.c-a > p.c-fine, .c-a > p.c-meta { font-size: var(--ds-text-sm); }
.c-a > p.c-meta { font-size: var(--ds-text-xs); }
.c-a__lead { font-weight: var(--ds-weight-medium); color: var(--ds-ink); }
.c-a[data-kind="prose"] > .c-h4 { margin-block-start: var(--ds-space-3); }
.c-a a:not([class]), .c-sub a:not([class]) { color: var(--ds-ink-link); text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; text-decoration-color: var(--ds-rule-strong); }
.c-a a:not([class]):hover, .c-sub a:not([class]):hover { color: var(--ds-accent-ink); text-decoration-color: currentColor; }
.c-aside { font-style: normal; color: var(--ds-ink-muted); }
.c-list { margin: 0; padding-inline-start: 1.3em; list-style: disc; display: flex; flex-direction: column; gap: var(--ds-space-2); }
.c-list[data-kind="ol"] { list-style: decimal; }
.c-list li::marker { color: var(--ds-ink-muted); font-family: var(--ds-font-mono); font-size: var(--ds-text-sm); }
.c-list[data-kind="asks"] { list-style: none; padding: 0; gap: 0; border-block-start: 1px solid var(--ds-rule); }
.c-list[data-kind="asks"] li { padding-block: var(--ds-space-2); border-block-end: 1px solid var(--ds-rule); }
.c-list[data-kind="asks"] q { quotes: "“" "”"; }
.c-sub { display: flex; flex-direction: column; gap: var(--ds-space-3); padding-block-start: var(--ds-space-5); border-block-start: 1px solid var(--ds-rule); }
.c-a > .c-sub:first-child { padding-block-start: 0; border-block-start: 0; }
.c-a > .c-sub + .c-sub { margin-block-start: var(--ds-space-2); }
.c-table { margin-block: var(--ds-space-1); }
.c-table.c-wide { --_min-w: 34rem; }
/* the footer's container matches the page frame (the stage's --x-max) */
.c-foot .ds-footer { --_max: calc(var(--x-max) + 2 * var(--x-pad)); --ds-gutter-page: var(--x-pad); }

/* the footnotes: a short rule in the citation blue, then "1  guide.md L186" (the hero's mono line label) */
.c-notes { margin: var(--ds-space-1) 0 0; padding: var(--ds-space-3) 0 0; list-style: none; display: flex; flex-direction: column; gap: var(--ds-space-2); position: relative; font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); line-height: 1.5; color: var(--ds-ink-muted); }
.c-notes::before { content: ""; position: absolute; inset-block-start: 0; inset-inline-start: 0; inline-size: var(--ds-space-8); block-size: 1px; background: var(--ds-accent); }
.c-a .c-notes li, .c-notes li { font-size: inherit; line-height: inherit; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: var(--ds-space-2); }
.c-notes__body { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ds-space-1-5) var(--ds-space-2); min-block-size: 1.6em; min-width: 0; }
.c-notes__n { display: inline-grid; place-items: center; min-inline-size: 1.6em; block-size: 1.6em; border-radius: var(--ds-radius-pill); background: var(--ds-accent-tint); color: var(--ds-accent-ink); font-weight: var(--ds-weight-semibold); }
.c-notes__link { color: var(--ds-ink); text-decoration: underline; text-decoration-color: var(--ds-rule-strong); text-underline-offset: .2em; font-family: var(--ds-font-sans); font-size: var(--ds-text-sm); }
.c-notes__link:hover { color: var(--ds-accent-ink); }
.c-notes__on { color: var(--ds-ink-muted); }
.c-notes .x-ln { text-decoration: none; }
.c-notes .x-ln:hover { background: var(--ds-accent); color: var(--ds-ink-on-accent); }

/* --- contents: the chapters as questions with their line ranges */
.c-toc { margin: 0; padding: 0; list-style: none; border-block-start: 1px solid var(--ds-rule); }
.c-toc__a { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto; align-items: baseline; gap: var(--ds-space-3); padding-block: var(--ds-space-3); border-block-end: 1px solid var(--ds-rule); color: var(--ds-ink); text-decoration: none; transition: color var(--ds-dur-fast); }
.c-toc__n, .c-toc__ln { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); color: var(--ds-ink-muted); }
.c-toc__ln { color: var(--ds-accent-ink); }
.c-toc__q { font-family: var(--ds-font-display); font-weight: var(--ds-heading-weight); letter-spacing: var(--ds-heading-tracking); font-size: var(--ds-text-lg); line-height: var(--ds-lh-heading); }
.c-toc__a:hover .c-toc__q { color: var(--ds-accent-ink); }
.c-toc__a:focus-visible, .c-qlist__a:focus-visible, .c-on__a:focus-visible, .c-q__a:focus-visible { outline: var(--ds-ring-width) solid var(--ds-ring); outline-offset: var(--ds-ring-offset); }
.c-actions { margin: 0; display: flex; flex-wrap: wrap; gap: var(--ds-space-3) var(--ds-space-6); }

/* --- the guides as question lists */
.c-qlist { margin: 0; padding: 0; list-style: none; min-width: 0; }
.c-qlist__a { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: var(--ds-space-4); padding-block: var(--ds-space-2-5); border-block-end: 1px solid var(--ds-rule); color: var(--ds-ink); text-decoration: none; font-size: var(--ds-text-md); line-height: var(--ds-lh-body); }
.c-qlist li:first-child .c-qlist__a { padding-block-start: 0; }
.c-qlist li:last-child .c-qlist__a { border-block-end: 0; }
.c-qlist__w { font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); color: var(--ds-ink-muted); white-space: nowrap; }
.c-qlist__a:hover .c-qlist__t { color: var(--ds-accent-ink); }

/* --- the way on (guide) */
.c-on > .c-row { align-items: baseline; }
.c-on__a { display: flex; flex-direction: column; gap: var(--ds-space-2); color: var(--ds-ink); text-decoration: none; }
.c-on__a:hover .c-q { color: var(--ds-accent-ink); }
.c-on__first { margin: 0; }

/* --- page heads */
.c-pagehead { padding-block: clamp(var(--ds-space-10), 6vw, var(--ds-space-16)) var(--ds-space-4); }
.c-crumbs a { color: var(--ds-ink-muted); text-decoration: underline; text-decoration-color: var(--ds-rule); text-underline-offset: .2em; }
.c-pagehead .c-row[data-kind="title"] .c-side { gap: var(--ds-space-4); }

/* --- a multi-line config file (no multi-line code component: the code-snippet well, by hand) */
.c-file { margin: 0; display: flex; flex-direction: column; border: 1px solid var(--ds-rule); border-radius: var(--ds-radius-sm); background: var(--ds-surface-2); min-width: 0; }
.c-file__cap { padding: var(--ds-space-1-5) var(--ds-space-3); border-block-end: 1px solid var(--ds-rule); font-family: var(--ds-font-mono); font-size: var(--ds-text-xs); color: var(--ds-ink-muted); }
.c-file__pre { margin: 0; padding: var(--ds-space-3); overflow-x: auto; font-family: var(--ds-font-mono); font-size: var(--ds-text-sm); line-height: 1.6; color: var(--ds-ink-code); }

/* --- sign-up */
.c-form { display: flex; flex-direction: column; gap: var(--ds-space-4); min-width: 0; max-inline-size: 42rem; }
.c-form__row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--ds-space-3); }
.c-field { flex: 1 1 16rem; display: flex; flex-direction: column; gap: var(--ds-space-1-5); min-width: 0; }
.c-field .ds-text-input { --_w: 100%; }
.c-hp { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); }

/* --- sources (copilot list) sits in the answer column */
.c-row[data-kind="sources"] .ds-citation-sources { max-inline-size: 42rem; }

/* ============================ phones + small tablets: one column, question above answer */
@media (max-width: 899px) {
  .c-head, .c-row { grid-template-columns: minmax(0, 1fr); }
  .c-row { padding-block: var(--ds-space-6); }
  .c-rows[data-kind="chapters"] > .c-row { padding-block: var(--ds-space-8); }
  .c-q { max-inline-size: none; }
  .c-row[data-kind="short"] { margin-block-start: var(--ds-space-6); }
}
@media (max-width: 760px) {
  .c-ask__track { overflow-x: auto; scrollbar-width: none; -webkit-mask: linear-gradient(90deg, currentColor 85%, transparent); mask: linear-gradient(90deg, currentColor 85%, transparent); }
  .c-ask__track::-webkit-scrollbar { display: none; }
  .c-ask__track > * { inline-size: max-content; flex-wrap: nowrap; }
  .c-ask .ds-suggestion-chips__chip { flex: none; } /* gap: suggestion-chips has no single-line scroll mode for a nav row */
  .c-a > p, .c-sub > p, .c-a li { font-size: var(--ds-text-md); }
  .c-toc__q { font-size: var(--ds-text-md); }
  .c-qlist__a { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .c-qlist__w { display: none; }
}
</style>
